server {
    listen 1443 ssl;
    listen [::]:1443 ssl;
    server_name rfid.nomigen.fyi;

    ssl_certificate /root/cert/rfid.nomigen.fyi/fullchain.pem;
    ssl_certificate_key /root/cert/rfid.nomigen.fyi/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:RFIDHunterSSL:10m;

    client_max_body_size 20m;

    # The token is substituted on the VPS from its protected data file during
    # deployment. All other paths are dropped by nginx before reaching ASGI.
    location = /__TOKEN__ {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location ^~ /__TOKEN__/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        return 444;
    }
}
