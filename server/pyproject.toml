[project]
name = "rfidhunter-server"
version = "0.1.0"
description = "Incremental backup API for RFIDHunter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "cryptography>=43,<46",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfidhunter_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
